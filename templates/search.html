{% extends "layout.html" %}

{% block content %}
<nav class="tabs" aria-label="検索の種類">
  {% if mode == "ai" %}
  <a class="tab" href="{{ url_for('index') }}">キーワード検索</a>
  <span class="tab tab-current" aria-current="page">AI 検索</span>
  {% else %}
  <span class="tab tab-current" aria-current="page">キーワード検索</span>
  <a class="tab" href="{{ url_for('index', mode='ai') }}">AI 検索</a>
  {% endif %}
</nav>

{% if mode == "ai" %}
{% include "_ai_search.html" %}
{% else %}
{% include "_keyword_search.html" %}
{% endif %}
{% endblock %}
